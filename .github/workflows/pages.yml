name: Deploy Country Finder to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        run: git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /tmp/flutter-sdk
      - name: Resolve dependencies
        run: /tmp/flutter-sdk/bin/flutter pub get
      - name: Build web release
        run: /tmp/flutter-sdk/bin/flutter build web --release --base-href /Flutter-Project/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
